name: Export

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  GODOT_VERSION: "4.6"
  GODOT_RELEASE: "stable"
  PROJECT_PATH: project

jobs:
  export:
    name: Export
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: cache-bin
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/godot
          key: godot-bin-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Cache export templates
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Install Godot
        if: steps.cache-bin.outputs.cache-hit != 'true'
        run: |
          BIN="Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}_linux.x86_64"
          wget -q "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}/${BIN}.zip" \
               -O /tmp/godot.zip
          mkdir -p ~/.local/bin
          unzip -q /tmp/godot.zip -d /tmp/godot_extract/
          mv "/tmp/godot_extract/$BIN" ~/.local/bin/godot
          chmod +x ~/.local/bin/godot

      - name: Download export templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          TPZ="Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}_export_templates.tpz"
          wget -q "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}/$TPZ" \
               -O /tmp/templates.tpz
          # Use version.txt inside the archive to get the exact directory name Godot expects
          TEMPLATES_VERSION=$(unzip -p /tmp/templates.tpz templates/version.txt)
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/$TEMPLATES_VERSION"
          mkdir -p "$TEMPLATES_DIR"
          unzip -q /tmp/templates.tpz -d /tmp/templates_extract/
          mv /tmp/templates_extract/templates/* "$TEMPLATES_DIR/"

      - name: Add Godot to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup Android environment
        run: |
          # Generate a keystore for APK signing
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -noprompt 2>/dev/null

          # Ensure required Android SDK components are available
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -f "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" 2>/dev/null || true
          fi

          # Install Android build template from export templates (required for Gradle build)
          TEMPLATES_DIR=$(find "$HOME/.local/share/godot/export_templates" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | head -1)
          ANDROID_SRC_ZIP="${TEMPLATES_DIR}/android_source.zip"
          if [ -f "$ANDROID_SRC_ZIP" ]; then
            mkdir -p "$GITHUB_WORKSPACE/$PROJECT_PATH/android"
            unzip -q "$ANDROID_SRC_ZIP" -d "$GITHUB_WORKSPACE/$PROJECT_PATH/android/build/"
            touch "$GITHUB_WORKSPACE/$PROJECT_PATH/android/.gdignore"
            echo "$(basename "$TEMPLATES_DIR")" > "$GITHUB_WORKSPACE/$PROJECT_PATH/android/build/.version"
          fi

          # Write Godot editor settings so it can find the Android SDK and keystore
          mkdir -p ~/.config/godot
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\""
            echo "export/android/debug_keystore = \"$HOME/.android/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > ~/.config/godot/editor_settings-4.tres

      - name: Create output directories
        run: mkdir -p builds/{windows-32,windows-64,linux-x86_32,linux-x86_64,linux-arm64,macos,android,web}

      - name: Export Windows 32
        continue-on-error: true
        run: |
          godot --headless --path "$PROJECT_PATH" \
            --export-release "Windows 32" \
            "$GITHUB_WORKSPACE/builds/windows-32/CopypartyClient.exe"

      - name: Export Windows 64
        continue-on-error: true
        run: |
          godot --headless --path "$PROJECT_PATH" \
            --export-release "Windows Desktop" \
            "$GITHUB_WORKSPACE/builds/windows-64/CopypartyClient.exe"

      - name: Export Linux x86_32
        continue-on-error: true
        run: |
          godot --headless --path "$PROJECT_PATH" \
            --export-release "Linux x86_32" \
            "$GITHUB_WORKSPACE/builds/linux-x86_32/CopypartyClient.x86_32"

      - name: Export Linux x86_64
        continue-on-error: true
        run: |
          godot --headless --path "$PROJECT_PATH" \
            --export-release "Linux" \
            "$GITHUB_WORKSPACE/builds/linux-x86_64/CopypartyClient.x86_64"

      - name: Export Linux arm64
        continue-on-error: true
        run: |
          godot --headless --path "$PROJECT_PATH" \
            --export-release "Linux arm64" \
            "$GITHUB_WORKSPACE/builds/linux-arm64/CopypartyClient.arm64"

      - name: Export macOS
        continue-on-error: true
        run: |
          godot --headless --path "$PROJECT_PATH" \
            --export-release "macOS" \
            "$GITHUB_WORKSPACE/builds/macos/CopypartyClient.zip"

      - name: Export Android
        continue-on-error: true
        run: |
          godot --headless --path "$PROJECT_PATH" \
            --export-release "Android" \
            "$GITHUB_WORKSPACE/builds/android/CopypartyClient.apk"

      - name: Export Web
        continue-on-error: true
        run: |
          godot --headless --path "$PROJECT_PATH" \
            --export-release "Web" \
            "$GITHUB_WORKSPACE/builds/web/index.html"

      - name: Package builds
        run: |
          cd builds
          [ -f windows-32/CopypartyClient.exe ] && zip -r windows-32.zip windows-32/
          [ -f windows-64/CopypartyClient.exe ] && zip -r windows-64.zip windows-64/
          [ -f linux-x86_32/CopypartyClient.x86_32 ] && zip -r linux-x86_32.zip linux-x86_32/
          [ -f linux-x86_64/CopypartyClient.x86_64 ] && zip -r linux-x86_64.zip linux-x86_64/
          [ -f linux-arm64/CopypartyClient.arm64 ] && zip -r linux-arm64.zip linux-arm64/
          # macOS export from Godot is already a zip containing the .app bundle
          [ -f macos/CopypartyClient.zip ] && cp macos/CopypartyClient.zip macos.zip
          [ -f android/CopypartyClient.apk ] && zip -r android.zip android/
          [ -f web/index.html ] && zip -r web.zip web/

      - name: Upload Windows 32 artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-32
          path: builds/windows-32/
          if-no-files-found: warn

      - name: Upload Windows 64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-64
          path: builds/windows-64/
          if-no-files-found: warn

      - name: Upload Linux x86_32 artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_32
          path: builds/linux-x86_32/
          if-no-files-found: warn

      - name: Upload Linux x86_64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: builds/linux-x86_64/
          if-no-files-found: warn

      - name: Upload Linux arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: builds/linux-arm64/
          if-no-files-found: warn

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: builds/macos/CopypartyClient.zip
          if-no-files-found: warn

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: builds/android/CopypartyClient.apk
          if-no-files-found: warn

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: builds/web/
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" builds/*.zip \
            --title "Release $TAG" \
            --generate-notes
